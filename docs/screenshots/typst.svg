<text x="47.6" y="315.8" fill="#0C0C0C" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">T</text>
<text x="56.0" y="315.8" fill="#CCCCCC" textLength="546.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">he ferry came late that October. Maren stood at the rail with her</text>
<text x="14.0" y="332.8" fill="#767676" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">15</text>
<text x="47.6" y="332.8" fill="#CCCCCC" textLength="546.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bag between her feet and counted the lights along the breakwater:</text>
<text x="14.0" y="349.8" fill="#767676" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">16</text>
<text x="47.6" y="349.8" fill="#F9F1A5" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">_steady green_</text>
<text x="165.2" y="349.8" fill="#CCCCCC" textLength="260.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, then red, every four seconds.</text>
<text x="14.0" y="366.8" fill="#767676" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">17</text>
<text x="14.0" y="383.8" fill="#767676" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">18</text>
<text x="47.6" y="383.8" fill="#B4009E" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">== The lamp room</text>
