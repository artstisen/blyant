<text x="14.0" y="349.8" fill="#CCCCCC" textLength="537.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  5  - [ ] Check the tide times in chapter 2 against the almanac</text>
<text x="14.0" y="366.8" fill="#CCCCCC" textLength="495.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  6  - [ ] Give the ferryman a reason to stay on the island</text>
<text x="14.0" y="383.8" fill="#CCCCCC" textLength="260.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  7  - [ ] Read chapter 3 aloud</text>
