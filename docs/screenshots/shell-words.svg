<text x="434.0" y="22" fill="#A0A0A0" text-anchor="middle">Blyant: the shell, words of a line numbered, and one changed by its number</text>
<text x="14.0" y="60.8" fill="#CCCCCC" textLength="428.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Blyant v1.6.1: help lists the commands, exit leaves</text>
<text x="14.0" y="77.8" fill="#CCCCCC" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; words todo.md 5</text>
<text x="14.0" y="94.8" fill="#CCCCCC" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-&gt; todo.md, line 5</text>
<text x="14.0" y="111.8" fill="#CCCCCC" textLength="814.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  #1:7 Check  #2:13 the  #3:17 tide  #4:22 times  #5:28 in  #6:31 chapter  #7:39 2  #8:41 against</text>
<text x="14.0" y="128.8" fill="#CCCCCC" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  #9:49 the  #10:53 tables</text>
<text x="14.0" y="145.8" fill="#CCCCCC" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&lt;- 10 words</text>
<text x="14.0" y="162.8" fill="#CCCCCC" textLength="571.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; word todo.md 5 #10 replace almanac</text>
<text x="14.0" y="179.8" fill="#CCCCCC" textLength="546.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   5  - [ ] Check the tide times in chapter 2 against the almanac</text>
<text x="14.0" y="196.8" fill="#CCCCCC" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">C:\Writing\Harbour Lights\todo.md: line 5 changed</text>
<text x="14.0" y="213.8" fill="#CCCCCC" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-&gt; todo.md, line 5</text>
<text x="14.0" y="230.8" fill="#CCCCCC" textLength="814.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  #1:7 Check  #2:13 the  #3:17 tide  #4:22 times  #5:28 in  #6:31 chapter  #7:39 2  #8:41 against</text>
<text x="14.0" y="247.8" fill="#CCCCCC" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  #9:49 the  #10:53 almanac</text>
<text x="14.0" y="264.8" fill="#CCCCCC" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&lt;- 10 words</text>
<text x="14.0" y="281.8" fill="#CCCCCC" textLength="420.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; peek todo.md 3-7</text>
<text x="14.0" y="298.8" fill="#CCCCCC" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-^ todo.md</text>
