<text x="425.6" y="400.8" fill="#B4009E" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|</text>
<text x="14.0" y="417.8" fill="#CCCCCC" textLength="310.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Read it aloud before the next draft.</text>
<text x="425.6" y="417.8" fill="#B4009E" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|</text>
<text x="442.4" y="417.8" fill="#B4009E" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The logbook was in the drawer of the chart tabl</text>
<text x="425.6" y="434.8" fill="#B4009E" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|</text>
<text x="442.4" y="434.8" fill="#B4009E" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">a pair of reading glasses with one arm mended i</text>
<text x="425.6" y="451.8" fill="#B4009E" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|</text>
<text x="425.6" y="468.8" fill="#B4009E" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|</text>
<text x="442.4" y="468.8" fill="#B4009E" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Maren opened it at the last page. The entries s</text>
<text x="425.6" y="485.8" fill="#B4009E" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|</text>
<text x="442.4" y="485.8" fill="#B4009E" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">middle of a sentence, and the harbour lights we</text>
<text x="425.6" y="502.8" fill="#B4009E" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|</text>
<text x="442.4" y="502.8" fill="#B4009E" textLength="294.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">margin, each with a tick beside it.</text>
