<svg xmlns="http://www.w3.org/2000/svg" width="868" height="572" viewBox="0 0 868 572">
<title>Blyant: the shell, @ is the file and the line worked on last</title>
<style>text{font-family:"Cascadia Mono","Cascadia Code",Consolas,"DejaVu Sans Mono",Menlo,monospace;font-size:14px;white-space:pre}</style>
<rect width="100%" height="100%" rx="10" fill="#0C0C0C"/>
<rect width="100%" height="34" rx="10" fill="#2B2B2B"/>
<rect y="24" width="100%" height="10" fill="#2B2B2B"/>
<circle cx="20" cy="17" r="6" fill="#FF5F57"/>
<circle cx="40" cy="17" r="6" fill="#FEBC2E"/>
<circle cx="60" cy="17" r="6" fill="#28C840"/>
<text x="434.0" y="22" fill="#A0A0A0" text-anchor="middle">Blyant: the shell, @ is the file and the line worked on last</text>
<text x="14.0" y="60.8" fill="#CCCCCC" textLength="428.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Blyant v1.5.8: help lists the commands, exit leaves</text>
<text x="14.0" y="77.8" fill="#CCCCCC" textLength="470.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; peek todo.md /ferryman</text>
<text x="14.0" y="94.8" fill="#CCCCCC" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-&gt; todo.md</text>
<text x="14.0" y="111.8" fill="#CCCCCC" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   1  # To do</text>
<text x="14.0" y="128.8" fill="#CCCCCC" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   2</text>
<text x="14.0" y="145.8" fill="#CCCCCC" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   3  ## Now</text>
<text x="14.0" y="162.8" fill="#CCCCCC" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   4</text>
<text x="14.0" y="179.8" fill="#CCCCCC" textLength="537.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   5  - [ ] Check the tide times in chapter 2 against the tables</text>
<text x="14.0" y="196.8" fill="#CCCCCC" textLength="504.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt;  6  - [ ] Give the ferryman a reason to stay on the island</text>
<text x="14.0" y="213.8" fill="#CCCCCC" textLength="268.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   7  - [ ] Read chapter 3 aloud</text>
<text x="14.0" y="230.8" fill="#CCCCCC" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   8</text>
<text x="14.0" y="247.8" fill="#CCCCCC" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   9  ## Done</text>
<text x="14.0" y="264.8" fill="#CCCCCC" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  10</text>
<text x="14.0" y="281.8" fill="#CCCCCC" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  11  - [x] Move the logbook scene to chapter 3</text>
<text x="14.0" y="298.8" fill="#CCCCCC" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&lt;- match 1 of 1, lines 1-11 of 11</text>
<text x="14.0" y="315.8" fill="#CCCCCC" textLength="596.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; insert @ - [ ] Ask the harbour master</text>
<text x="14.0" y="332.8" fill="#CCCCCC" textLength="403.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">C:\Writing\Harbour Lights\todo.md: line 7 put in</text>
<text x="14.0" y="349.8" fill="#CCCCCC" textLength="478.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; lines @ end (chapter 4)</text>
<text x="14.0" y="366.8" fill="#CCCCCC" textLength="378.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  7  - [ ] Ask the harbour master (chapter 4)</text>
<text x="14.0" y="383.8" fill="#CCCCCC" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">C:\Writing\Harbour Lights\todo.md: line 7 changed</text>
<text x="14.0" y="400.8" fill="#CCCCCC" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; shift @ up</text>
<text x="14.0" y="417.8" fill="#CCCCCC" textLength="378.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  6  - [ ] Ask the harbour master (chapter 4)</text>
<text x="14.0" y="434.8" fill="#CCCCCC" textLength="462.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">C:\Writing\Harbour Lights\todo.md: line moved to line 6</text>
<text x="14.0" y="451.8" fill="#CCCCCC" textLength="420.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; echo $file $line</text>
<text x="14.0" y="468.8" fill="#CCCCCC" textLength="294.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">C:\Writing\Harbour Lights\todo.md 6</text>
<text x="14.0" y="485.8" fill="#CCCCCC" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; shift! @ Done</text>
<text x="14.0" y="502.8" fill="#CCCCCC" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  11  - [x] Ask the harbour master (chapter 4)</text>
<text x="14.0" y="519.8" fill="#CCCCCC" textLength="470.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">C:\Writing\Harbour Lights\todo.md: line moved to line 11</text>
<text x="14.0" y="536.8" fill="#CCCCCC" textLength="268.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Task boxes ticked or unticked: 1</text>
<rect x="299.6" y="541" width="8.4" height="17" fill="#CCCCCC"/>
<text x="14.0" y="553.8" fill="#CCCCCC" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt;</text>
</svg>
