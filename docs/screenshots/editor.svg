<text x="14.0" y="94.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  1</text>
<text x="56.0" y="94.8" fill="#F9F1A5" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Chapter 3: The Logbook</text>
<rect x="14.0" y="99" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="111.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  2</text>
<rect x="14.0" y="116" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="128.8" fill="#CCCCCC" textLength="680.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  3  The logbook was in the drawer of the chart table, under a tin of matches and</text>
<rect x="14.0" y="133" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="145.8" fill="#CCCCCC" textLength="495.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  4  a pair of reading glasses with one arm mended in wire.</text>
<rect x="14.0" y="150" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="162.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  5</text>
<rect x="14.0" y="167" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="179.8" fill="#CCCCCC" textLength="512.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  6  Maren opened it at the last page. The entries stopped in</text>
<text x="534.8" y="179.8" fill="#61D6D6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">**March**</text>
<text x="610.4" y="179.8" fill="#CCCCCC" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, in the</text>
<rect x="14.0" y="184" width="294.0" height="17" fill="#0037DA"/>
<rect x="308.0" y="184" width="58.8" height="17" fill="#F9F1A5"/>
<rect x="366.8" y="184" width="487.2" height="17" fill="#0037DA"/>
<text x="14.0" y="196.8" fill="#CCCCCC" textLength="285.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  7  middle of a sentence, and the</text>
<text x="308.0" y="196.8" fill="#0C0C0C" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">harbour</text>
<text x="366.8" y="196.8" fill="#CCCCCC" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> lights were listed one by one down the</text>
<rect x="14.0" y="201" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="213.8" fill="#CCCCCC" textLength="336.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  8  margin, each with a tick beside it.</text>
<rect x="14.0" y="218" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="230.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  9</text>
<rect x="14.0" y="235" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="247.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 10</text>
<text x="56.0" y="247.8" fill="#16C60C" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## The entries</text>
<rect x="14.0" y="252" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="264.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 11</text>
<rect x="14.0" y="269" width="67.2" height="17" fill="#0037DA"/>
<rect x="81.2" y="269" width="8.4" height="17" fill="#CCCCCC"/>
<rect x="89.6" y="269" width="50.4" height="17" fill="#F9F1A5"/>
<rect x="140.0" y="269" width="714.0" height="17" fill="#0037DA"/>
<text x="14.0" y="281.8" fill="#F2F2F2" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 12</text>
<text x="56.0" y="281.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="72.8" y="281.8" fill="#F9F1A5" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">*</text>
<text x="81.2" y="281.8" fill="#0C0C0C" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Harbour</text>
<text x="140.0" y="281.8" fill="#F9F1A5" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> mouth:*</text>
<text x="207.2" y="281.8" fill="#CCCCCC" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> steady green, all night</text>
<rect x="14.0" y="286" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="298.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 13</text>
<text x="56.0" y="298.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="72.8" y="298.8" fill="#F9F1A5" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">*North pier:*</text>
<text x="182.0" y="298.8" fill="#CCCCCC" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> red, flashing every four seconds</text>
<rect x="14.0" y="303" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="315.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 14</text>
<text x="56.0" y="315.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="72.8" y="315.8" fill="#F9F1A5" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">*The Teeth:*</text>
<text x="173.6" y="315.8" fill="#CCCCCC" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> white, two flashes, then dark</text>
<rect x="14.0" y="320" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="332.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 15</text>
<rect x="14.0" y="337" width="546.0" height="17" fill="#0037DA"/>
<rect x="560.0" y="337" width="58.8" height="17" fill="#F9F1A5"/>
<rect x="618.8" y="337" width="235.2" height="17" fill="#0037DA"/>
<text x="14.0" y="349.8" fill="#CCCCCC" textLength="537.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 16  She read them twice. The Teeth had been dark for years; the</text>
<text x="560.0" y="349.8" fill="#0C0C0C" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">harbour</text>
<text x="618.8" y="349.8" fill="#CCCCCC" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> board had</text>
<rect x="14.0" y="354" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="366.8" fill="#CCCCCC" textLength="672.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 17  said so in a letter she still had somewhere. But her grandfather had ticked</text>
<rect x="14.0" y="371" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="383.8" fill="#CCCCCC" textLength="268.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 18  it every night until March.</text>
<rect x="14.0" y="388" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="400.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 19</text>
<rect x="14.0" y="405" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="417.8" fill="#CCCCCC" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 20  &gt; Saw the Teeth again tonight. Two flashes. Nobody on the rocks.</text>
<rect x="14.0" y="422" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="434.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 21</text>
<rect x="14.0" y="439" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="451.8" fill="#CCCCCC" textLength="428.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 22  She closed the book and listened to the clock.</text>
<rect x="14.0" y="456" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="468.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 23</text>
<rect x="14.0" y="473" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="485.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 24</text>
<text x="56.0" y="485.8" fill="#16C60C" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## The first night</text>
<rect x="14.0" y="490" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="502.8" fill="#CCCCCC" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 25</text>
<rect x="14.0" y="507" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="519.8" fill="#CCCCCC" textLength="663.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 26  The wind came round to the east after midnight and the windows of the lamp</text>
