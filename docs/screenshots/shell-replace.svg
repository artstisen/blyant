<svg xmlns="http://www.w3.org/2000/svg" width="868" height="572" viewBox="0 0 868 572">
<title>Blyant: the shell, replace -n shows what would change, and asks</title>
<style>text{font-family:"Cascadia Mono","Cascadia Code",Consolas,"DejaVu Sans Mono",Menlo,monospace;font-size:14px;white-space:pre}</style>
<rect width="100%" height="100%" rx="10" fill="#0C0C0C"/>
<rect width="100%" height="34" rx="10" fill="#2B2B2B"/>
<rect y="24" width="100%" height="10" fill="#2B2B2B"/>
<circle cx="20" cy="17" r="6" fill="#FF5F57"/>
<circle cx="40" cy="17" r="6" fill="#FEBC2E"/>
<circle cx="60" cy="17" r="6" fill="#28C840"/>
<text x="434.0" y="22" fill="#A0A0A0" text-anchor="middle">Blyant: the shell, replace -n shows what would change, and asks</text>
<text x="14.0" y="60.8" fill="#CCCCCC" textLength="428.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Blyant v1.5.9: help lists the commands, exit leaves</text>
<text x="14.0" y="77.8" fill="#CCCCCC" textLength="588.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; replace -n chapter-01.md Maren Marit</text>
<text x="14.0" y="94.8" fill="#CCCCCC" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-^ chapter-01.md</text>
<text x="14.0" y="111.8" fill="#CCCCCC" textLength="688.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   3  The ferry was late, as it always was in October, and Marit Holt stood at the</text>
<text x="14.0" y="128.8" fill="#CCCCCC" textLength="336.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  20  *For Marit. Wind the clock first.*</text>
<text x="14.0" y="145.8" fill="#CCCCCC" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-v 2 lines of 22</text>
<text x="14.0" y="162.8" fill="#CCCCCC" textLength="604.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">C:\Writing\Harbour Lights\chapter-01.md: 2 would be replaced, in 2 lines</text>
<text x="14.0" y="179.8" fill="#CCCCCC" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Replace: Replace them in chapter-01.md?</text>
<text x="14.0" y="196.8" fill="#CCCCCC" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Y Yes  N No*: y</text>
<text x="14.0" y="213.8" fill="#CCCCCC" textLength="529.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">C:\Writing\Harbour Lights\chapter-01.md: 2 replaced, in 2 lines</text>
<text x="14.0" y="230.8" fill="#CCCCCC" textLength="319.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt; undo</text>
<text x="14.0" y="247.8" fill="#CCCCCC" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Undone: replace -n chapter-01.md Maren Marit</text>
<rect x="299.6" y="252" width="8.4" height="17" fill="#CCCCCC"/>
<text x="14.0" y="264.8" fill="#CCCCCC" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">blyant C:\Writing\Harbour Lights&gt;</text>
</svg>
