<text x="14.0" y="145.8" fill="#CCCCCC" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> # Chapter 1: The Lamp Room</text>
<text x="14.0" y="179.8" fill="#E74856" textLength="646.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-The ferry was late, as it always was in October, and Maren Holt stood at the</text>
<text x="14.0" y="196.8" fill="#16C60C" textLength="285.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">+The ferry came late that October.</text>
<text x="14.0" y="213.8" fill="#CCCCCC" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rail with her collar up and watched the island come out of the rain.</text>
<text x="14.0" y="247.8" fill="#CCCCCC" textLength="621.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> It was smaller than she remembered. The lighthouse sat on its rock like a</text>
