<text x="14.0" y="298.8" fill="#CCCCCC" textLength="646.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> She did not answer. Her grandfather had kept that light for forty-one years,</text>
<text x="14.0" y="315.8" fill="#CCCCCC" textLength="352.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> and he had never once let it keep itself.</text>
<text x="14.0" y="332.8" fill="#16C60C" textLength="453.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">+He had written it on the first page of every logbook.</text>
